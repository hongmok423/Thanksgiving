<script>

el("addChild").onclick=()=>{let p=current();if(!["10","18"].includes(p.id))return;let n=prompt("세부사업명");if(!n?.trim())return;let a=Number((prompt("금액(원)")||"").replaceAll(",",""));if(!Number.isSafeInteger(a)||a<=0||a>remain(p.id))return alert("미배정액 범위 내 금액을 입력하세요");change(()=>{let id=p.id+"-"+Date.now(),i=db.items.findLastIndex(x=>x.id===p.id||x.parent===p.id);db.items.splice(i+1,0,{id,name:n.trim(),amount:a,owner:p.owner,parent:p.id,url:"",desc:"",post:false,bill:false,vw:false,vs:false,paid:false,checked:false,memo:""});chosen=id})};
el("export").onclick=()=>{let blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="thanksgiving-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
el("import").onclick=()=>el("backup").click();el("backup").onchange=async e=>{let f=e.target.files?.[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x.items)||!Array.isArray(x.plans))throw Error("백업 형식이 다릅니다");if(confirm("현재 기록을 백업 파일로 덮어쓰시겠습니까?")){db=x;chosen=db.items[0]?.id;write();render()}}catch(err){alert("복원 실패: "+err.message)}e.target.value=""};
if(db.updatedAt)el("status").textContent="마지막 브라우저 저장: "+new Date(db.updatedAt).toLocaleString("ko-KR");else el("status").textContent="초기 기록 · 변경 시 이 브라우저에 자동 저장";render();
})();
</script></body></html>
